<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurvenkarte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg: #14171A;
  --surface: #1E2226;
  --border: #33383D;
  --text: #ECE9E2;
  --text-dim: #9AA1A6;
  --accent: #FF6A00;
  --low: #4FB286;
  --mid: #E8A33D;
  --high: #FF6A00;
}

*{ box-sizing: border-box; }

html, body{
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1, .stat-value{
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.topbar{
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.topbar h1{
  font-size: 26px;
  margin: 0;
}

.upload-btn{
  background: var(--accent);
  color: #14171A;
  font-weight: 600;
  font-size: 14px;
  padding: 10px 16px;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}

main{
  display: flex;
  flex-direction: column;
  height: calc(100% - 57px);
}

#map{
  height: 42vh;
  min-height: 240px;
  background: #0d0f11;
}

.panel{
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px 32px;
}

.route-builder{
  margin-bottom: 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.route-builder h2{
  font-size: 20px;
  margin: 0 0 10px;
}

.field-row{
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.route-builder input[type="text"]{
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 9px 10px;
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 8px;
}

.field-row input[type="text"]{ margin-bottom: 0; }

.icon-btn{
  flex: none;
  width: 40px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  border-radius: 4px;
  font-size: 16px;
  cursor: pointer;
}

.primary-btn{
  width: 100%;
  background: var(--accent);
  color: #14171A;
  border: none;
  border-radius: 4px;
  padding: 10px;
  font-weight: 600;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.primary-btn:disabled{
  opacity: 0.5;
  cursor: default;
}

.status-text{
  font-size: 12.5px;
  color: var(--text-dim);
  margin: 8px 0 0;
  min-height: 16px;
}

.status-text.error{
  color: var(--accent);
}

.sort-row{
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
}

.chip{
  flex: none;
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

.chip.active{
  border-color: var(--accent);
  color: var(--accent);
}

.filter-row{
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-size: 13px;
  color: var(--text-dim);
}

.filter-row input{
  width: 64px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 4px;
  padding: 6px 8px;
  font-family: inherit;
}

.route-list{
  list-style: none;
  margin: 0;
  padding: 0;
}

.route-row{
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}

.route-row:hover{
  background: rgba(255,255,255,0.02);
}

.route-row.selected{
  background: rgba(255,106,0,0.08);
}

.curve-bar{
  width: 4px;
  flex: none;
  margin: 10px 0;
  border-radius: 2px;
}

.route-info{
  flex: 1;
  padding: 12px 14px;
  min-width: 0;
}

.route-name{
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.route-stats{
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
}

.stat{
  display: flex;
  align-items: baseline;
  gap: 5px;
  color: var(--text-dim);
  font-size: 12.5px;
}

.stat-value{
  color: var(--text);
  font-size: 17px;
  line-height: 1;
}

.route-delete{
  flex: none;
  width: 40px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 18px;
  cursor: pointer;
}

.route-delete:hover{
  color: var(--accent);
}

.empty-state{
  display: none;
  color: var(--text-dim);
  font-size: 14px;
  padding: 24px 0;
  text-align: center;
}

@media (min-width: 860px){
  main{ flex-direction: row; }
  #map{ height: 100%; flex: 1.4; min-height: 0; }
  .panel{ flex: 1; max-width: 460px; }
}

</style>
</head>
<body>

<header class="topbar">
  <h1>Kurvenkarte</h1>
  <label class="upload-btn">
    GPX importieren
    <input type="file" id="gpx-input" accept=".gpx" multiple hidden>
  </label>
</header>

<main>
  <div id="map"></div>

  <section class="panel">
    <div class="route-builder">
      <h2>Route erstellen</h2>
      <div class="field-row">
        <input type="text" id="start-input" placeholder="Start (Ort oder Adresse)">
        <button id="use-location-btn" class="icon-btn" type="button" title="Aktuellen Standort verwenden">📍</button>
      </div>
      <input type="text" id="end-input" placeholder="Ziel (Ort oder Adresse)">
      <button id="build-route-btn" class="primary-btn" type="button">Route berechnen</button>
      <p id="route-builder-status" class="status-text"></p>
    </div>

    <div class="sort-row" id="sort-row" role="group" aria-label="Sortierung">
      <button class="chip active" data-sort="curviness">Kurvigste zuerst</button>
      <button class="chip" data-sort="curves">Meiste Kurven</button>
      <button class="chip" data-sort="duration">Kürzeste Zeit</button>
      <button class="chip" data-sort="distance">Kürzeste Distanz</button>
    </div>

    <div class="filter-row">
      <label for="min-curves">Mind. Kurven</label>
      <input type="number" id="min-curves" min="0" value="0" inputmode="numeric">
    </div>

    <ul id="route-list" class="route-list"></ul>
    <p id="empty-state" class="empty-state">Noch keine Routen importiert. Lade eine oder mehrere GPX-Dateien hoch, um loszulegen.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Parst GPX-Text in { name, points: [{lat, lon, ele, time}] }
function parseGPX(xmlText, fallbackName) {
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');

  if (doc.querySelector('parsererror')) {
    throw new Error(`"${fallbackName}" ist keine gültige GPX-Datei.`);
  }

  const nameEl = doc.querySelector('trk > name') || doc.querySelector('metadata > name');
  const name = (nameEl && nameEl.textContent.trim()) || fallbackName.replace(/\.gpx$/i, '');

  const trkpts = Array.from(doc.querySelectorAll('trkpt'));
  const points = trkpts.map(pt => {
    const lat = parseFloat(pt.getAttribute('lat'));
    const lon = parseFloat(pt.getAttribute('lon'));
    const timeEl = pt.querySelector('time');
    const eleEl = pt.querySelector('ele');
    return {
      lat,
      lon,
      time: timeEl ? new Date(timeEl.textContent).getTime() : null,
      ele: eleEl ? parseFloat(eleEl.textContent) : null
    };
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lon));

  if (points.length < 2) {
    throw new Error(`"${fallbackName}" enthält zu wenige Trackpunkte.`);
  }

  return { name, points };
}
// Geo-Hilfsfunktionen und Kurvenerkennung auf Basis von Richtungsänderungen (Bearing)

function toRad(deg) { return deg * Math.PI / 180; }
function toDeg(rad) { return rad * 180 / Math.PI; }

function haversineDistance(a, b) {
  const R = 6371000; // Meter
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function bearing(a, b) {
  const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
  const dLon = toRad(b.lon - a.lon);
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

// -180..180
function angleDiff(a, b) {
  let d = b - a;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  return d;
}

// Dünnt sehr dicht aufgezeichnete Punkte aus, damit GPS-Jitter (z.B. an Ampeln)
// nicht als Kurve gezählt wird.
function resample(points, minDist = 12) {
  if (points.length === 0) return [];
  const result = [points[0]];
  let last = points[0];
  for (let i = 1; i < points.length; i++) {
    if (haversineDistance(last, points[i]) >= minDist) {
      result.push(points[i]);
      last = points[i];
    }
  }
  if (result[result.length - 1] !== points[points.length - 1]) {
    result.push(points[points.length - 1]);
  }
  return result;
}

// Erkennt zusammenhängende Kurvensegmente: solange sich die Richtung kontinuierlich
// in dieselbe Richtung ändert, gilt das als eine Kurve. Erst ab einem kumulierten
// Winkel >= curveThreshold zählt es wirklich als Kurve (filtert normales Lenken
// auf leicht geschwungenen Straßen raus).
function detectCurves(points, { noiseThreshold = 3, curveThreshold = 20 } = {}) {
  const pts = resample(points);
  if (pts.length < 3) return [];

  const curves = [];
  let turnSum = 0;
  let dir = 0;
  let startIdx = null;

  const closeCurrent = (endIdx) => {
    if (startIdx !== null && Math.abs(turnSum) >= curveThreshold) {
      curves.push({ startIdx, endIdx, angle: turnSum });
    }
    startIdx = null;
    turnSum = 0;
    dir = 0;
  };

  for (let i = 1; i < pts.length - 1; i++) {
    const b1 = bearing(pts[i - 1], pts[i]);
    const b2 = bearing(pts[i], pts[i + 1]);
    const delta = angleDiff(b1, b2);

    if (Math.abs(delta) < noiseThreshold) {
      closeCurrent(i);
      continue;
    }

    const d = Math.sign(delta);
    if (dir !== 0 && d !== dir) {
      closeCurrent(i);
      startIdx = i;
      turnSum = delta;
      dir = d;
    } else {
      if (startIdx === null) startIdx = i;
      turnSum += delta;
      dir = d;
    }
  }
  closeCurrent(pts.length - 1);

  return curves;
}

function classifyCurve(angle) {
  const a = Math.abs(angle);
  if (a >= 90) return 'scharf';
  if (a >= 45) return 'mittel';
  return 'leicht';
}

function formatDuration(minutes) {
  if (!Number.isFinite(minutes)) return '–';
  const h = Math.floor(minutes / 60);
  const m = Math.round(minutes % 60);
  return h > 0 ? `${h} h ${m} min` : `${m} min`;
}

// Analysiert eine geparste Route und liefert alle Kennzahlen für Anzeige/Filter.
function analyzeRoute(points) {
  let distanceM = 0;
  for (let i = 1; i < points.length; i++) {
    distanceM += haversineDistance(points[i - 1], points[i]);
  }
  const distanceKm = distanceM / 1000;

  const hasTime = points[0].time != null && points[points.length - 1].time != null;
  const durationMin = hasTime
    ? (points[points.length - 1].time - points[0].time) / 60000
    : null;

  const curves = detectCurves(points);
  const curveCount = curves.length;
  const curviness = distanceKm > 0 ? curveCount / distanceKm : 0; // Kurven pro km

  const counts = { leicht: 0, mittel: 0, scharf: 0 };
  curves.forEach(c => counts[classifyCurve(c.angle)]++);

  return {
    distanceKm,
    durationMin,
    curveCount,
    curviness,
    curveBreakdown: counts,
    curves
  };
}
// Geocoding + Routing auf Basis freier OSM-Dienste.
// Hinweis: OSRM-Demo-Server ist nur für geringes, persönliches Aufkommen gedacht,
// kein SLA. Für ernsthafte Nutzung später ggf. eigener Server nötig.

const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving';

async function geocode(query) {
  const url = `${NOMINATIM_URL}?format=json&limit=1&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'de' } });
  if (!res.ok) throw new Error('Geocoding fehlgeschlagen.');
  const data = await res.json();
  if (!data.length) throw new Error(`Ort "${query}" wurde nicht gefunden.`);
  return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
}

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error('Standortabfrage wird von diesem Browser nicht unterstützt.'));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, label: 'Aktueller Standort' }),
      err => reject(new Error('Standort konnte nicht ermittelt werden (' + err.message + ').')),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

// Liefert die schnellste Route (Auto-Profil) zwischen zwei Punkten.
// Kein Kurven-Gewicht möglich – reine Basis-Route, wird danach mit unserer
// eigenen Kurvenerkennung analysiert.
async function fetchRoute(start, end) {
  const url = `${OSRM_URL}/${start.lon},${start.lat};${end.lon},${end.lat}?overview=full&geometries=geojson`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Routenberechnung fehlgeschlagen.');
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
    throw new Error('Keine Route zwischen Start und Ziel gefunden.');
  }
  const r = data.routes[0];
  const points = r.geometry.coordinates.map(([lon, lat]) => ({ lat, lon, time: null }));
  return { points, durationSec: r.duration, distanceM: r.distance };
}
const STORAGE_KEY = 'kurvenkarte.routes.v1';

/** @type {Array<{id:string, name:string, path:number[][], stats:object, addedAt:number}>} */
let routes = [];
let selectedId = null;
let sortMode = 'curviness';
let minCurves = 0;

// --- Persistenz (localStorage: reicht für persönliche Nutzung mit
// überschaubar vielen Touren. Falls das Limit mal erreicht wird, ist
// IndexedDB der nächste Schritt.) ---
function loadRoutes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    routes = raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error('Konnte gespeicherte Routen nicht laden', e);
    routes = [];
  }
}

function saveRoutes() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(routes));
  } catch (e) {
    alert('Speichern fehlgeschlagen (Speicherlimit erreicht?). Ggf. alte Touren löschen.');
  }
}

// --- Karte ---
const map = L.map('map', { zoomControl: true }).setView([51.96, 7.63], 8); // Münster-Region
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap-Mitwirkende',
  maxZoom: 19
}).addTo(map);

const routeLayers = new Map(); // id -> L.Polyline

function curvinessColor(curviness) {
  if (curviness >= 3.5) return '#FF6A00';
  if (curviness >= 1.5) return '#E8A33D';
  return '#4FB286';
}

function drawRoute(route) {
  const layer = L.polyline(route.path, {
    color: curvinessColor(route.stats.curviness),
    weight: 4,
    opacity: 0.85
  }).addTo(map);
  layer.on('click', () => selectRoute(route.id));
  routeLayers.set(route.id, layer);
}

function redrawAllRoutes() {
  routeLayers.forEach(layer => map.removeLayer(layer));
  routeLayers.clear();
  routes.forEach(drawRoute);
}

function fitToAllRoutes() {
  const layers = Array.from(routeLayers.values());
  if (layers.length === 0) return;
  const group = L.featureGroup(layers);
  map.fitBounds(group.getBounds(), { padding: [24, 24] });
}

function selectRoute(id) {
  selectedId = id;
  const layer = routeLayers.get(id);
  if (layer) map.fitBounds(layer.getBounds(), { padding: [40, 40] });
  renderList();
}

// --- Import ---
const fileInput = document.getElementById('gpx-input');
fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  for (const file of files) {
    try {
      const text = await file.text();
      const parsed = parseGPX(text, file.name);
      const stats = analyzeRoute(parsed.points);
      const path = parsed.points
        .filter((_, i) => i % 3 === 0) // für die Kartenlinie ausdünnen, Analyse lief auf Vollauflösung
        .map(p => [Number(p.lat.toFixed(6)), Number(p.lon.toFixed(6))]);

      const route = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        name: parsed.name,
        path,
        stats,
        source: 'imported',
        addedAt: Date.now()
      };
      routes.push(route);
      drawRoute(route);
    } catch (err) {
      alert(err.message || `"${file.name}" konnte nicht importiert werden.`);
    }
  }
  saveRoutes();
  fitToAllRoutes();
  renderList();
  fileInput.value = '';
});

// --- Route erstellen (Start/Ziel/Standort) ---
const startInput = document.getElementById('start-input');
const endInput = document.getElementById('end-input');
const useLocationBtn = document.getElementById('use-location-btn');
const buildRouteBtn = document.getElementById('build-route-btn');
const statusEl = document.getElementById('route-builder-status');

let startOverride = null; // gesetzt, wenn Start über Standortabfrage kam

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = 'status-text' + (isError ? ' error' : '');
}

useLocationBtn.addEventListener('click', async () => {
  setStatus('Ermittle Standort…', false);
  try {
    const pos = await getCurrentPosition();
    startOverride = pos;
    startInput.value = 'Aktueller Standort';
    setStatus('', false);
  } catch (err) {
    setStatus(err.message, true);
  }
});

startInput.addEventListener('input', () => { startOverride = null; });

buildRouteBtn.addEventListener('click', async () => {
  const startQuery = startInput.value.trim();
  const endQuery = endInput.value.trim();
  if (!startQuery || !endQuery) {
    setStatus('Bitte Start und Ziel angeben.', true);
    return;
  }

  buildRouteBtn.disabled = true;
  try {
    setStatus('Suche Orte…', false);
    const start = startOverride || await geocode(startQuery);
    const end = await geocode(endQuery);

    setStatus('Berechne Route…', false);
    const { points, durationSec } = await fetchRoute(start, end);

    const stats = analyzeRoute(points);
    stats.durationMin = durationSec / 60; // OSRM liefert eigene Fahrzeitschätzung

    const path = points
      .filter((_, i) => i % 2 === 0)
      .map(p => [Number(p.lat.toFixed(6)), Number(p.lon.toFixed(6))]);

    const route = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      name: `${startQuery} → ${endQuery}`,
      path,
      stats,
      source: 'generated',
      addedAt: Date.now()
    };

    routes.push(route);
    drawRoute(route);
    saveRoutes();
    fitToAllRoutes();
    renderList();
    setStatus('Route hinzugefügt – aktuell die schnellste Verbindung, noch nicht kurvenoptimiert.', false);
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    buildRouteBtn.disabled = false;
  }
});

// --- Sortierung & Filter ---
document.getElementById('sort-row').addEventListener('click', (e) => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  sortMode = btn.dataset.sort;
  renderList();
});

document.getElementById('min-curves').addEventListener('input', (e) => {
  minCurves = Number(e.target.value) || 0;
  renderList();
});

function sortedFilteredRoutes() {
  const filtered = routes.filter(r => r.stats.curveCount >= minCurves);
  const sorters = {
    curviness: (a, b) => b.stats.curviness - a.stats.curviness,
    curves: (a, b) => b.stats.curveCount - a.stats.curveCount,
    duration: (a, b) => (a.stats.durationMin ?? Infinity) - (b.stats.durationMin ?? Infinity),
    distance: (a, b) => a.stats.distanceKm - b.stats.distanceKm
  };
  return filtered.sort(sorters[sortMode]);
}

// --- Liste rendern ---
const listEl = document.getElementById('route-list');
const emptyEl = document.getElementById('empty-state');

function renderList() {
  const items = sortedFilteredRoutes();
  listEl.innerHTML = '';
  emptyEl.style.display = routes.length === 0 ? 'block' : 'none';

  items.forEach(route => {
    const li = document.createElement('li');
    li.className = 'route-row' + (route.id === selectedId ? ' selected' : '');

    const bar = document.createElement('div');
    bar.className = 'curve-bar';
    bar.style.background = curvinessColor(route.stats.curviness);

    const info = document.createElement('div');
    info.className = 'route-info';
    info.innerHTML = `
      <p class="route-name">${escapeHtml(route.name)}</p>
      <div class="route-stats">
        <span class="stat"><span class="stat-value">${route.stats.distanceKm.toFixed(0)}</span> km</span>
        <span class="stat"><span class="stat-value">${formatDuration(route.stats.durationMin)}</span></span>
        <span class="stat"><span class="stat-value">${route.stats.curveCount}</span> Kurven</span>
        <span class="stat"><span class="stat-value">${route.stats.curviness.toFixed(1)}</span> Kurven/km</span>
      </div>
    `;

    const del = document.createElement('button');
    del.className = 'route-delete';
    del.setAttribute('aria-label', 'Route löschen');
    del.textContent = '✕';
    del.addEventListener('click', (ev) => {
      ev.stopPropagation();
      deleteRoute(route.id);
    });

    li.addEventListener('click', () => selectRoute(route.id));
    li.append(bar, info, del);
    listEl.appendChild(li);
  });
}

function deleteRoute(id) {
  routes = routes.filter(r => r.id !== id);
  const layer = routeLayers.get(id);
  if (layer) { map.removeLayer(layer); routeLayers.delete(id); }
  saveRoutes();
  renderList();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Start ---
loadRoutes();
redrawAllRoutes();
fitToAllRoutes();
renderList();

</script>
</body>
</html>
